<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Playground</title>
<style>
:root{--add:#43a047;--sub:#1e88e5;--mul:#fb8c00;--div:#8e24aa;--mix:#d81b60;--tab:#00897b;--tro:#ffb300;--ink:#37474f}
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Chalkboard SE","Comic Neue",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff8e1 0%,#e1f5fe 50%,#f3e5f5 100%);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}
.logo{font-size:26px;font-weight:bold;cursor:pointer;background:linear-gradient(90deg,#e53935,#fb8c00,#f9a825,#43a047,#1e88e5,#8e24aa);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.pill{background:#fff3e0;border-radius:999px;padding:6px 14px;font-weight:bold;font-size:18px}
.iconbtn{border:none;background:#eceff1;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:20px}
.screen{display:none}.screen.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:36px;margin:10px 0}
h2{margin:24px 0 12px}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:18px}
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mascot{font-size:64px;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{position:relative;background:#f1f8e9;border-radius:18px;padding:14px 18px;font-size:20px;flex:1;min-width:200px}
.bubble:before{content:"";position:absolute;left:-18px;top:22px;border:9px solid transparent;border-right:10px solid #f1f8e9}
.bubble .row{justify-content:flex-start}
input.name{font:inherit;font-size:22px;padding:10px 14px;border:3px solid #ffca28;border-radius:14px;width:260px;max-width:100%}
.btn{font:inherit;font-size:18px;font-weight:bold;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;color:#fff;background:#546e7a;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.small{font-size:15px;padding:8px 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;align-items:center}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.level{cursor:pointer;border:4px solid transparent;text-align:center;transition:transform .15s}
.level.sel{border-color:#ffca28;background:#fffde7;transform:scale(1.03)}
.level .big{font-size:34px}.level b{display:block;font-size:20px;margin:4px 0}.level small{font-size:14px;color:#607d8b}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.game{cursor:pointer;color:#fff;text-align:center;padding:24px 16px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.game:hover,.game:focus{transform:translateY(-4px) rotate(-1deg);outline:none}
.game .big{font-size:46px}.game b{display:block;font-size:22px;margin-top:6px}.game small{opacity:.92}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.bar h1{margin:0;font-size:30px}
select{font:inherit;font-size:16px;padding:8px;border-radius:12px;border:2px solid #cfd8dc;background:#fff}
.seg{display:inline-flex;background:#eceff1;border-radius:14px;padding:4px;flex-wrap:wrap}
.seg button{font:inherit;border:none;background:transparent;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:bold}
.timer{font-size:28px;font-weight:bold;min-width:120px;text-align:center;padding:4px 14px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.timer.warn{color:#e53935;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.layout{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.prob{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 3px 8px rgba(0,0,0,.07);border:3px solid transparent}
.prob .q{font-size:26px;font-weight:bold;flex:1;text-align:right;white-space:nowrap}
.prob input{font:inherit;font-size:26px;font-weight:bold;width:92px;padding:6px;text-align:center;border:3px solid #ffca28;border-radius:12px;background:#fffde7;color:var(--ink)}
.prob input:focus{outline:none;border-color:#ff9800;box-shadow:0 0 0 4px rgba(255,152,0,.25)}
.prob .mark{width:32px;font-size:24px;text-align:center}
.prob .hint{width:100%;font-size:14px;background:#fff8e1;border-radius:8px;padding:4px 8px}
.prob.ok{border-color:#66bb6a;background:#e8f5e9}.prob.ok input{border-color:#66bb6a;background:#c8e6c9;color:#2e7d32}
.prob.ok .mark{animation:pop .5s}
.prob.bad{border-color:#ef5350;background:#ffebee;animation:shake .35s}
.prob.missed input{color:#90a4ae;border-color:#cfd8dc;background:#fafafa}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.6)}}
.side .card{margin-bottom:14px;text-align:center}
.stars{font-size:40px;font-weight:bold;color:#f9a825}
.progress{height:18px;background:#eceff1;border-radius:9px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:linear-gradient(90deg,#ffca28,#ff7043);width:0;transition:width .4s}
.streak{font-size:20px;font-weight:bold;color:#e65100;min-height:28px;margin-top:6px}
.side .bubble{font-size:17px;text-align:left}
.pic{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;max-width:280px;margin:10px auto 0}
.pic div{aspect-ratio:1;background:#b0bec5;border-radius:3px;transition:background .4s}
.pic div.on{animation:pop .5s}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.num{font:inherit;font-size:22px;font-weight:bold;width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.num.on{background:var(--tab);color:#fff}
table.tt{border-collapse:separate;border-spacing:3px;margin:auto}
.tt th{background:var(--tab);color:#fff;min-width:38px;height:34px;border-radius:8px}
.tt td{background:#f5f5f5;min-width:38px;height:34px;text-align:center;border-radius:8px;cursor:pointer;font-weight:bold}
.tt td:hover{background:#b2dfdb}.tt td.hl{background:#fff59d}.tt td.x{background:#ff7043;color:#fff}
.fact{font-size:32px;font-weight:bold;color:var(--tab);min-height:48px}
.ttrow{font-size:18px;padding:2px 0}
.tips{margin-top:16px}.tips p{margin:6px 0;font-size:17px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{text-align:center}.badge .big{font-size:44px}.badge b{display:block}.badge small{color:#78909c}
.badge.locked{filter:grayscale(1);opacity:.45}
table.bt{width:100%;border-collapse:collapse;font-size:17px}
.bt th,.bt td{padding:8px;border-bottom:1px solid #eceff1;text-align:center}.bt td:first-child{text-align:left;font-weight:bold}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s}
.modal{max-width:470px;width:92%;text-align:center}.modal h2{font-size:38px;margin:4px 0}.modal p{font-size:19px;margin:8px 0}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #ffca28;border-radius:16px;padding:12px 20px;font-size:20px;font-weight:bold;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:drop .4s}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>
</head>
<body>
<header>
  <span class="logo" id="logo" title="Home">🎈 Math Playground</span>
  <span class="spacer"></span>
  <span class="pill" id="hdrStars"></span>
  <button class="iconbtn" id="btnTro" title="My Trophies">🏆</button>
  <button class="iconbtn" id="btnSound" title="Sound on/off"></button>
</header>
<main>
  <section id="home" class="screen active"></section>
  <section id="game" class="screen"></section>
  <section id="tables" class="screen"></section>
  <section id="trophies" class="screen"></section>
</main>
<canvas id="confetti"></canvas>
<script>
'use strict';
const KEY = 'mathPlayground.v1';
const LEVELS = [
  {name: 'Rookie', icon: '🐣', desc: '+ − within 20 · × ÷ up to 5'},
  {name: 'Explorer', icon: '🧭', desc: '+ − within 100 · × ÷ up to 10'},
  {name: 'Champion', icon: '🏅', desc: '3-digit + − · missing numbers'},
  {name: 'Math Wizard', icon: '🧙', desc: 'Regrouping · 11s, 12s & tens'},
];
const SEC_PER_Q = [10, 9, 8, 6];
const GAMES = {
  add: {title: 'Addition Adventure', icon: '➕', color: 'var(--add)', n: 10, sub: 'Put numbers together'},
  sub: {title: 'Subtraction Safari', icon: '➖', color: 'var(--sub)', n: 10, sub: 'Take numbers away'},
  mul: {title: 'Multiplication Mission', icon: '✖️', color: 'var(--mul)', n: 10, sub: 'Groups of numbers'},
  div: {title: 'Division Detective', icon: '➗', color: 'var(--div)', n: 10, sub: 'Share equally'},
  mix: {title: 'Mixed Challenge', icon: '🎯', color: 'var(--mix)', n: 20, sub: 'All four + a mystery picture!'},
};
const BADGES = [
  {id: 'first', icon: '🌟', name: 'First Star', desc: 'Earn your first star', stars: 1},
  {id: 'bronze', icon: '🥉', name: 'Bronze', desc: 'Collect 25 stars', stars: 25},
  {id: 'silver', icon: '🥈', name: 'Silver', desc: 'Collect 100 stars', stars: 100},
  {id: 'gold', icon: '🥇', name: 'Gold', desc: 'Collect 250 stars', stars: 250},
  {id: 'legend', icon: '🏆', name: 'Math Legend', desc: 'Collect 500 stars', stars: 500},
  {id: 'streak', icon: '🔥', name: 'Hot Streak', desc: '10 right in a row on the first try'},
  {id: 'perfect', icon: '💯', name: 'Perfect Round', desc: 'Finish a round with no mistakes'},
  {id: 'explorer', icon: '🧭', name: 'All-Rounder', desc: 'Finish a round of +, −, × and ÷'},
  {id: 'picture', icon: '🖼️', name: 'Picture Revealer', desc: 'Reveal a mystery picture'},
  {id: 'speedy', icon: '⚡', name: 'Speedy', desc: 'Stopwatch round under 1 min (Mixed: 2 min)'},
  {id: 'clock', icon: '⏳', name: 'Clock Beater', desc: 'Finish a Beat the Clock round in time'},
  {id: 'level4', icon: '🧙', name: 'Wizard Round', desc: 'Finish a round at Level 4'},
];
// 10x10 pixel art; digits index into PALETTE
const PICS = [
  {name: 'a smiley face 😊', rows: ['1112222111','1224444221','2444444442','2442442442','2444444442','2844444482','2424444242','2442222442','1224444221','1112222111']},
  {name: 'a rocket 🚀', rows: ['1111331111','1113333111','1116666111','1116226111','1116226111','1116666111','1136666311','1336666331','1114554111','1111451111']},
  {name: 'a cat 🐱', rows: ['5111111115','5511111155','5555555555','5525555255','5555555555','5555885555','2555225552','5555555555','1555555551','1155555511']},
  {name: 'a heart ❤️', rows: ['1111111111','1331111331','3333113333','3633333333','3333333333','1333333331','1133333311','1113333111','1111331111','1111111111']},
];
const PALETTE = ['#b0bec5','#bbdefb','#333333','#e53935','#ffd54f','#fb8c00','#ffffff','#43a047','#f48fb1'];
const YAY = ['Great job!', 'You got it!', 'Super!', 'Awesome!', 'Math magic! ✨', 'Nailed it!', 'Brilliant!', 'Way to go!'];
const OOPS = ['Almost! Try again 💪', 'Oops, check it one more time!', 'So close! You can do it!', 'Hmm, not quite. Try again!'];
const JOKES = [
  'Why was 6 afraid of 7? Because 7 8 9! 😱',
  'Why did the math book look sad? It had too many problems! 📘',
  'What did the 0 say to the 8? Nice belt! 👖',
  "What's a math teacher's favorite dessert? Pi! 🥧",
  'Why do plants hate math? It gives them square roots! 🌱',
  'What do you call friends who love math? Algebros! 🤝',
  'Why is 10 scared of 11? Because 11 is bigger and always in the teens! 😄',
];
const TIPS = [
  '💡 Swap the numbers, same answer: 3 × 7 = 7 × 3',
  '💡 The 9s trick: 9, 18, 27, 36… the digits always add up to 9!',
  '💡 Any number × 10: just add a 0 on the end!',
  '💡 Division is multiplication backwards: 6 × 4 = 24, so 24 ÷ 4 = 6',
  '💡 The 5s always end in 0 or 5.',
];

// ---------- storage (this device only) ----------
function defaults() {
  return {name: '', level: 1, sound: true, timer: {}, stars: 0, best: {}, badges: {}, done: {}, bestStreak: 0};
}
function load() {
  const s = defaults();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && typeof saved === 'object') Object.assign(s, saved);
  } catch (e) { /* storage unavailable: play without saving */ }
  for (const k of ['timer', 'best', 'badges', 'done']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  s.level = Math.min(4, Math.max(1, parseInt(s.level, 10) || 1));
  s.name = String(s.name || '').slice(0, 20);
  s.stars = Number(s.stars) || 0;
  return s;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
const nm = () => S.name || 'Math Star';

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
function toast(msg) { const t = el('div', {class: 'toast'}, msg); document.body.append(t); setTimeout(() => t.remove(), 3000); }
function modal(children) { const ov = el('div', {class: 'overlay'}, el('div', {class: 'modal card'}, ...children)); document.body.append(ov); return ov; }

// ---------- sound (generated, no files) ----------
let actx = null;
function tone(freqs, dur = 0.12, type = 'sine', gap = 0.1) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) { /* audio not supported */ }
}
const SND = {
  ok: () => tone([660, 880]),
  bad: () => tone([220, 180], 0.15, 'triangle'),
  win: () => tone([523, 659, 784, 1047], 0.2, 'sine', 0.12),
  tick: () => tone([1000], 0.05, 'square'),
  badge: () => tone([784, 988, 1175], 0.15),
};

// ---------- confetti ----------
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#ec407a'];
  const ps = Array.from({length: 160}, () => ({x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5,
    vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: pick(cols)}));
  const end = Date.now() + 3500;
  (function frame() {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (Date.now() < end) requestAnimationFrame(frame); else x.clearRect(0, 0, c.width, c.height);
  })();
}

// ---------- problem generators ----------
const parts = n => [Math.floor(n / 100) * 100, Math.floor(n % 100 / 10) * 10, n % 10].filter(Boolean);
const tens = n => Math.floor(n / 10) % 10;

function genAdd(L) {
  let a, b;
  if (L === 1) { a = ri(1, 10); b = ri(0, 10); }
  else if (L === 2) { a = ri(10, 89); b = ri(2, 99 - a); }
  else if (L === 3) {
    const h = ri(1, 8), t = ri(0, 9), u = ri(0, 9);
    a = h * 100 + t * 10 + u; b = ri(1, 9 - h) * 100 + ri(0, 9 - t) * 10 + ri(0, 9 - u);
  } else {
    do { a = ri(100, 899); b = ri(100, 999 - a); } while (!(a % 10 + b % 10 >= 10 || tens(a) + tens(b) >= 10));
  }
  return {text: `${a} + ${b} =`, ans: a + b,
    hint: b < 10 ? `Start at ${a} and count up ${b}.` : `Break it up: ${a} + ${parts(b).join(' + ')}`};
}
function genSub(L) {
  let a, b;
  if (L === 1) { a = ri(5, 20); b = ri(0, Math.min(a, 10)); }
  else if (L === 2) { a = ri(20, 99); b = ri(5, a - 1); }
  else if (L === 3) {
    const h = ri(2, 9), t = ri(0, 9), u = ri(0, 9);
    a = h * 100 + t * 10 + u; b = ri(1, h) * 100 + ri(0, t) * 10 + ri(0, u);
  } else {
    do { a = ri(200, 999); b = ri(100, a - 1); } while (!(a % 10 < b % 10 || tens(a) < tens(b)));
  }
  return {text: `${a} − ${b} =`, ans: a - b,
    hint: b < 10 ? `Start at ${a} and count back ${b}.` : `Break it up: ${a} − ${parts(b).join(' − ')}`};
}
function genMul(L) {
  let a, b;
  if (L === 1) { a = ri(1, 5); b = ri(0, 10); }
  else if (L === 2) { a = ri(2, 10); b = ri(0, 10); }
  else if (L === 3) {
    a = ri(2, 10); b = ri(2, 10);
    if (Math.random() < 0.4) return {text: `? × ${b} = ${a * b}`, ans: a, hint: `Count by ${b}s until you reach ${a * b}.`};
  } else if (Math.random() < 0.5) { a = pick([11, 12]); b = ri(2, 12); }
  else { a = 10 * ri(2, 9); b = ri(2, 9); }
  let hint;
  if (a === 0 || b === 0) hint = 'Anything × 0 is 0!';
  else if (a === 1 || b === 1) hint = 'Anything × 1 is itself!';
  else if (a >= 20 && a % 10 === 0) hint = `${a / 10} × ${b} = ${a / 10 * b}, then add a 0!`;
  else if (a >= 11) hint = `${b} × 10 = ${b * 10}, then add ${a - 10} more ${b}s.`;
  else hint = `Count by ${b}s, ${a} times: ${b}, ${b * 2}, ${b * 3}…`;
  const [x, y] = Math.random() < 0.5 ? [a, b] : [b, a];
  return {text: `${x} × ${y} =`, ans: a * b, hint};
}
function genDiv(L) {
  let d, q;
  if (L === 1) { d = ri(1, 5); q = ri(1, 10); }
  else if (L === 2) { d = ri(2, 10); q = ri(1, 10); }
  else if (L === 3) {
    d = ri(2, 10); q = ri(2, 10);
    if (Math.random() < 0.4) return {text: `${d * q} ÷ ? = ${q}`, ans: d, hint: `What times ${q} makes ${d * q}?`};
  } else if (Math.random() < 0.5) { d = pick([11, 12]); q = ri(2, 12); }
  else { d = ri(2, 9); q = 10 * ri(2, 9); }
  return {text: `${d * q} ÷ ${d} =`, ans: q, hint: `Think: ${d} × ? = ${d * q}`};
}
const GEN = {add: genAdd, sub: genSub, mul: genMul, div: genDiv};

function makeRound(key, L) {
  const ops = key === 'mix'
    ? shuffle(['add', 'sub', 'mul', 'div'].flatMap(o => Array(5).fill(o)))
    : Array(GAMES[key].n).fill(key);
  const seen = new Set();
  return ops.map(o => {
    let p;
    for (let i = 0; i < 50; i++) { p = GEN[o](L); if (!seen.has(p.text)) break; }
    seen.add(p.text);
    return Object.assign(p, {op: o, solved: false, tries: 0, last: ''});
  });
}

// ---------- navigation ----------
let G = null;
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}
function leaveGame() { stopTimer(); G = null; }
function goHome() { leaveGame(); renderHome(); show('home'); }
function openTables() { leaveGame(); renderTables(); show('tables'); }
function openTrophies() { leaveGame(); renderTrophies(); show('trophies'); }
function updateHeader() {
  $('#hdrStars').textContent = `⭐ ${S.stars}`;
  $('#btnSound').textContent = S.sound ? '🔊' : '🔇';
}
function backBar(title, color) {
  return el('div', {class: 'bar'}, el('button', {class: 'btn small', onclick: goHome}, '🏠 Home'), el('h1', {style: `color:${color}`}, title));
}

// ---------- home ----------
function renderHome() {
  const root = $('#home');
  root.replaceChildren();
  let bubble;
  if (!S.name) {
    const inp = el('input', {class: 'name', maxlength: '20', placeholder: 'Your name', 'aria-label': 'Your name'});
    const go = () => {
      const v = inp.value.trim().slice(0, 20);
      if (!v) { toast('Type your name first 🙂'); inp.focus(); return; }
      S.name = v; save(); SND.ok(); renderHome();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    bubble = el('div', {class: 'bubble'}, "Hi! I'm Ollie the Owl. What's your name?",
      el('div', {class: 'row'}, inp, el('button', {class: 'btn', style: 'background:#43a047', onclick: go}, "Let's play! 🚀")));
    setTimeout(() => inp.focus(), 50);
  } else {
    const joke = el('div', {style: 'margin-top:8px;font-size:17px;color:#6a1b9a'});
    bubble = el('div', {class: 'bubble'}, `Hi ${nm()}! Ready to earn some stars today? ⭐`, joke,
      el('div', {class: 'row'},
        el('button', {class: 'btn small', style: 'background:#7e57c2', onclick: () => { joke.textContent = pick(JOKES); }}, '😂 Tell me a joke'),
        el('button', {class: 'btn small', style: 'background:#90a4ae', onclick: () => { S.name = ''; save(); renderHome(); }}, '✏️ Change name')));
  }
  root.append(el('div', {class: 'card hello'}, el('div', {class: 'mascot'}, '🦉'), bubble));

  root.append(el('h2', {}, '1️⃣ Pick your level'), el('div', {class: 'levels'}, ...LEVELS.map((l, i) =>
    el('div', {class: 'card level' + (S.level === i + 1 ? ' sel' : ''), role: 'button', tabindex: '0',
      onclick: () => { S.level = i + 1; save(); renderHome(); },
      onkeydown: e => { if (e.key === 'Enter') { S.level = i + 1; save(); renderHome(); } }},
      el('div', {class: 'big'}, l.icon), el('b', {}, `Level ${i + 1}: ${l.name}`), el('small', {}, l.desc)))));

  const card = (icon, title, sub, color, fn) => el('div', {class: 'game', style: `background:${color}`, role: 'button', tabindex: '0',
    onclick: fn, onkeydown: e => { if (e.key === 'Enter') fn(); }}, el('div', {class: 'big'}, icon), el('b', {}, title), el('small', {}, sub));
  root.append(el('h2', {}, '2️⃣ Pick a game'), el('div', {class: 'games'},
    ...Object.entries(GAMES).map(([k, g]) => card(g.icon, g.title, g.sub, g.color, () => startGame(k))),
    card('🔢', 'Times Table Explorer', 'Discover patterns', 'var(--tab)', openTables),
    card('🏆', 'My Trophies', 'Badges & best times', 'var(--tro)', openTrophies)));
}

// ---------- game ----------
function startGame(key) { G = {key}; show('game'); newRound(); }

function newRound() {
  stopTimer();
  const key = G.key, n = GAMES[key].n;
  G = {key, L: S.level, mode: S.timer[key] || 'off', problems: makeRound(key, S.level),
    started: false, over: false, streak: 0, start: 0, tid: null, lastSec: null, limit: n * SEC_PER_Q[S.level - 1]};
  if (key === 'mix') {
    G.pic = ri(0, PICS.length - 1);
    G.owner = [];
    shuffle([...Array(100).keys()]).forEach((cell, pos) => { G.owner[cell] = Math.floor(pos / 5); });
  }
  renderGame();
}

function renderGame() {
  const g = GAMES[G.key], root = $('#game');
  root.replaceChildren();
  const lvl = el('select', {'aria-label': 'Level', onchange: e => { S.level = +e.target.value; save(); newRound(); }},
    ...LEVELS.map((l, i) => { const o = el('option', {value: i + 1}, `${l.icon} Level ${i + 1} · ${l.name}`); o.selected = i + 1 === G.L; return o; }));
  const seg = el('div', {class: 'seg', role: 'group', 'aria-label': 'Timer'},
    ...[['off', '🚫 No timer'], ['stopwatch', '⏱️ Stopwatch'], ['countdown', '⏳ Beat the Clock']].map(([m, t]) =>
      el('button', {class: m === G.mode ? 'on' : '', onclick: () => { S.timer[G.key] = m; save(); newRound(); }}, t)));
  const timer = el('div', {id: 'timer', class: 'timer'}, G.mode === 'stopwatch' ? '⏱️ 0:00' : '⏳ ' + fmt(G.limit));
  if (G.mode === 'off') timer.style.display = 'none';
  root.append(backBar(`${g.icon} ${g.title}`, g.color),
    el('div', {class: 'bar'}, lvl, seg, timer, el('div', {class: 'spacer'}),
      el('button', {class: 'btn', style: `background:${g.color}`, onclick: newRound}, '🔄 New Round')));

  const probs = el('div', {class: 'probs'});
  G.problems.forEach((p, i) => {
    const inp = el('input', {type: 'text', inputmode: 'numeric', autocomplete: 'off', maxlength: '6', 'aria-label': `Answer ${i + 1}`});
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); if (inp.value) startTimer(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(i); } });
    inp.addEventListener('change', () => check(i));
    const hint = el('div', {class: 'hint'}, '💡 ' + p.hint);
    hint.hidden = true;
    p.inp = inp; p.hintEl = hint; p.mark = el('span', {class: 'mark'});
    p.card = el('div', {class: 'prob'}, el('span', {class: 'q'}, p.text), inp, p.mark, hint);
    probs.append(p.card);
  });

  const side = el('div', {class: 'side'},
    el('div', {class: 'card'}, el('div', {id: 'starsTxt', class: 'stars'}), el('div', {class: 'progress'}, el('div', {id: 'prog'})), el('div', {id: 'streak', class: 'streak'})),
    el('div', {class: 'card hello'}, el('div', {class: 'mascot', style: 'font-size:46px'}, '🦉'), el('div', {id: 'say', class: 'bubble'})),
    G.key === 'mix' ? el('div', {class: 'card'}, el('b', {id: 'picCap'}, '🖼️ Mystery picture! Every ⭐ reveals a piece.'),
      el('div', {class: 'pic', id: 'pic'}, ...Array.from({length: 100}, () => el('div')))) : null);
  root.append(el('div', {class: 'layout'}, probs, side));

  const tip = G.mode === 'countdown' ? `You have ${fmt(G.limit)}. The clock starts when you type! ⏳`
    : G.mode === 'stopwatch' ? 'The stopwatch starts when you type! ⏱️' : "Let's go! 🚀";
  say(`Hi ${nm()}! Type each answer and press Enter. ${tip}`);
  updateScore();
  G.problems[0].inp.focus();
}

function say(msg) { const b = $('#say'); if (b) b.textContent = msg; }
function updateScore() {
  const n = G.problems.length, got = G.problems.filter(p => p.solved).length;
  $('#starsTxt').textContent = `⭐ ${got} / ${n}`;
  $('#prog').style.width = (got / n * 100) + '%';
  $('#streak').textContent = G.streak >= 3 ? `🔥 ${G.streak} in a row!` : '';
}

function startTimer() {
  if (!G || G.started || G.over) return;
  G.started = true; G.start = Date.now();
  if (G.mode !== 'off') G.tid = setInterval(tick, 200);
}
function stopTimer() { if (G && G.tid) { clearInterval(G.tid); G.tid = null; } }
function tick() {
  if (!G || G.over) return;
  const t = $('#timer'), s = (Date.now() - G.start) / 1000;
  if (G.mode === 'stopwatch') { t.textContent = '⏱️ ' + fmt(s); return; }
  const left = Math.max(0, G.limit - s), sec = Math.ceil(left);
  t.textContent = '⏳ ' + fmt(sec);
  t.classList.toggle('warn', left <= 10);
  if (sec <= 5 && sec > 0 && sec !== G.lastSec) SND.tick();
  G.lastSec = sec;
  if (left <= 0) finish(false);
}

function check(i) {
  if (!G || G.over) return;
  const p = G.problems[i], v = p.inp.value;
  if (p.solved || v === '' || v === p.last) return;
  p.last = v;
  startTimer();
  if (Number(v) === p.ans) {
    p.solved = true;
    p.card.classList.remove('bad'); p.card.classList.add('ok');
    p.mark.textContent = '⭐'; p.inp.readOnly = true;
    S.stars++;
    if (p.tries === 0) {
      G.streak++;
      S.bestStreak = Math.max(S.bestStreak || 0, G.streak);
      if (G.streak >= 10) award('streak');
    }
    SND.ok();
    BADGES.filter(b => b.stars && S.stars >= b.stars).forEach(b => award(b.id));
    if (G.key === 'mix') reveal(i);
    save(); updateHeader(); updateScore();
    if (G.problems.every(q => q.solved)) { finish(true); return; }
    const yay = pick(YAY);
    say(G.streak >= 3 ? `${yay} ${G.streak} in a row, ${nm()}! 🔥` : yay);
    focusNext(i);
  } else {
    p.tries++; G.streak = 0;
    p.card.classList.remove('bad'); void p.card.offsetWidth; p.card.classList.add('bad');
    p.mark.textContent = '🔁';
    SND.bad();
    if (p.tries >= 2) { p.hintEl.hidden = false; say(`Here's a hint, ${nm()}! Look under the problem 💡`); }
    else say(pick(OOPS));
    updateScore();
    p.inp.select();
  }
}
function focusNext(i) {
  const n = G.problems.length;
  for (let k = 1; k <= n; k++) {
    const q = G.problems[(i + k) % n];
    if (!q.solved) { q.inp.focus(); return; }
  }
}
function reveal(i) {
  const cells = $('#pic').children, rows = PICS[G.pic].rows;
  G.owner.forEach((o, c) => {
    if (o !== i) return;
    cells[c].style.background = PALETTE[+rows[Math.floor(c / 10)][c % 10]];
    cells[c].classList.add('on');
  });
  if (G.problems.every(q => q.solved)) $('#picCap').textContent = `🎉 It's ${PICS[G.pic].name}!`;
}

function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now();
  const b = BADGES.find(x => x.id === id);
  toast(`🎖️ New badge: ${b.icon} ${b.name}!`);
  setTimeout(SND.badge, 350);
}

function finish(allDone) {
  if (!G || G.over) return;
  G.over = true; stopTimer();
  const secs = G.started ? (Date.now() - G.start) / 1000 : 0;
  const n = G.problems.length, got = G.problems.filter(p => p.solved).length;
  const perfect = allDone && G.problems.every(p => p.tries === 0);
  G.problems.forEach(p => {
    p.inp.readOnly = true;
    if (!p.solved) { p.card.classList.remove('bad'); p.card.classList.add('missed'); p.inp.value = p.ans; p.mark.textContent = '👀'; }
  });
  let bestLine = null;
  if (allDone) {
    S.done[G.key] = (S.done[G.key] || 0) + 1;
    if (perfect) award('perfect');
    if (G.key === 'mix') award('picture');
    if (G.L === 4) award('level4');
    if (['add', 'sub', 'mul', 'div'].every(k => S.done[k])) award('explorer');
    if (G.mode === 'countdown') award('clock');
    if (G.mode === 'stopwatch') {
      if (secs < (n > 10 ? 120 : 60)) award('speedy');
      const k = `${G.key}-${G.L}`, prev = S.best[k];
      if (!prev || secs < prev) {
        S.best[k] = Math.round(secs * 10) / 10;
        bestLine = prev ? `🥇 New best time! (old best ${fmt(prev)})` : '🥇 Your first best time is saved!';
      } else bestLine = `Best time: ${fmt(prev)}`;
    }
    confetti(); SND.win();
  } else SND.bad();
  save();

  const title = perfect ? 'PERFECT! 🏆' : allDone ? 'You did it! 🎉' : "Time's up! ⏰";
  const msg = perfect ? `Wow, ${nm()}! No mistakes at all!`
    : allDone ? `Great job, ${nm()}! Every answer is correct.`
    : `Nice try, ${nm()}! The answers you missed are shown in gray.`;
  const kids = [el('h2', {}, title), el('div', {class: 'stars'}, `⭐ ${got} / ${n}`), el('p', {}, msg)];
  if (allDone && G.mode === 'stopwatch') kids.push(el('p', {}, `⏱️ Your time: ${fmt(secs)}`), el('p', {}, bestLine));
  if (allDone && G.mode === 'countdown') kids.push(el('p', {}, `⏳ Time left: ${fmt(G.limit - secs)}`));
  const btns = el('div', {class: 'row'});
  const ov = modal([...kids, btns]);
  const close = fn => () => { ov.remove(); fn(); };
  btns.append(el('button', {class: 'btn', style: 'background:#43a047', onclick: close(newRound)}, '🔄 Play again'));
  if (perfect && G.L < 4) btns.append(el('button', {class: 'btn', style: 'background:#fb8c00', onclick: close(() => { S.level = G.L + 1; save(); newRound(); })}, '⬆️ Level up!'));
  btns.append(el('button', {class: 'btn', onclick: close(goHome)}, '🏠 Home'));
  btns.append(el('button', {class: 'btn small', style: 'background:#90a4ae', onclick: () => ov.remove()}, '👀 Look at my answers'));
}

// ---------- times tables ----------
let TT = 7;
function renderTables() {
  const root = $('#tables');
  root.replaceChildren();
  root.append(backBar('🔢 Times Table Explorer', 'var(--tab)'),
    el('p', {style: 'font-size:18px;margin:0 0 10px'}, 'Pick a number to light up its times table. Tap any square to see the fact!'),
    el('div', {class: 'nums'}, ...Array.from({length: 12}, (_, i) =>
      el('button', {class: 'num' + (i + 1 === TT ? ' on' : ''), onclick: () => { TT = i + 1; renderTables(); }}, i + 1))));
  const fact = el('div', {class: 'fact'}, 'Tap a square!');
  const tbl = el('table', {class: 'tt'}, el('tr', {}, el('th', {}, '×'), ...Array.from({length: 12}, (_, c) => el('th', {}, c + 1))));
  for (let r = 1; r <= 12; r++) {
    const tr = el('tr', {}, el('th', {}, r));
    for (let c = 1; c <= 12; c++) {
      const cls = r === TT && c === TT ? 'x' : (r === TT || c === TT) ? 'hl' : '';
      tr.append(el('td', {class: cls, onclick: () => { fact.textContent = `${r} × ${c} = ${r * c}`; SND.ok(); }}, r * c));
    }
    tbl.append(tr);
  }
  root.append(el('div', {class: 'layout'},
    el('div', {class: 'card', style: 'overflow-x:auto'}, tbl),
    el('div', {class: 'card', style: 'text-align:center'}, fact, el('h3', {}, `The ${TT} times table`),
      ...Array.from({length: 12}, (_, i) => el('div', {class: 'ttrow'}, `${TT} × ${i + 1} = ${TT * (i + 1)}`)))),
    el('div', {class: 'card tips'}, ...TIPS.map(t => el('p', {}, t))));
}

// ---------- trophies ----------
function renderTrophies() {
  const root = $('#trophies');
  root.replaceChildren();
  const next = BADGES.find(b => b.stars && S.stars < b.stars);
  const prog = el('div', {class: 'progress'}, el('div', {style: `width:${next ? S.stars / next.stars * 100 : 100}%`}));
  root.append(backBar('🏆 My Trophies', '#f57f17'),
    el('div', {class: 'card hello'}, el('div', {class: 'mascot'}, '🦉'),
      el('div', {class: 'bubble'}, `${nm()}, you have collected ⭐ ${S.stars} stars!`, el('br'),
        next ? `Only ${next.stars - S.stars} more to unlock ${next.icon} ${next.name}!` : 'You unlocked every star badge! 🤩',
        el('br'), `Best streak: 🔥 ${S.bestStreak || 0} in a row`, prog)));

  root.append(el('h2', {}, `Badges (${Object.keys(S.badges).length} / ${BADGES.length})`),
    el('div', {class: 'badges'}, ...BADGES.map(b => el('div', {class: 'card badge' + (S.badges[b.id] ? '' : ' locked')},
      el('div', {class: 'big'}, b.icon), el('b', {}, b.name), el('small', {}, S.badges[b.id] ? '✅ ' + b.desc : '🔒 ' + b.desc)))));

  const head = el('tr', {}, el('th', {}, 'Game'), el('th', {}, 'Rounds finished'), ...LEVELS.map((l, i) => el('th', {}, `⏱️ Level ${i + 1}`)));
  const rows = Object.entries(GAMES).map(([k, g]) => el('tr', {}, el('td', {}, `${g.icon} ${g.title}`), el('td', {}, S.done[k] || 0),
    ...LEVELS.map((l, i) => el('td', {}, S.best[`${k}-${i + 1}`] ? fmt(S.best[`${k}-${i + 1}`]) : '—'))));
  root.append(el('h2', {}, 'Best stopwatch times'), el('div', {class: 'card', style: 'overflow-x:auto'}, el('table', {class: 'bt'}, head, ...rows)));

  root.append(el('div', {class: 'row', style: 'margin-top:24px'}, el('button', {class: 'btn small', style: 'background:#b0bec5', onclick: () => {
    if (!confirm('Erase all stars, badges and best times on this device?')) return;
    S = Object.assign(defaults(), {name: S.name, level: S.level, sound: S.sound});
    save(); updateHeader(); renderTrophies();
  }}, '🗑️ Reset my progress')));
}

// ---------- boot ----------
$('#logo').addEventListener('click', goHome);
$('#btnTro').addEventListener('click', openTrophies);
$('#btnSound').addEventListener('click', () => { S.sound = !S.sound; save(); updateHeader(); SND.ok(); });
updateHeader();
renderHome();
</script>
</body>
</html>
